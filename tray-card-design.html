<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ 精力管理 · 托盘菜单</title>
<style>
/* ── Fonts ── */
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;500&family=Figtree:wght@400;500;600;700;800;900&display=swap');

:root {
  --gold: #d4af37;
  --gold-dim: rgba(212, 175, 55, 0.12);
  --gold-line: rgba(212, 175, 55, 0.18);
  --gold-glow: rgba(212, 175, 55, 0.06);
  --teal: #6a9bcc;
  --teal-dim: rgba(106, 155, 204, 0.10);
  --deep: #08080c;
  --surface: #0e0e16;
  --surface2: #13131f;
  --text: #e8e6e1;
  --text-dim: #7a7a7a;
  --text-muted: #4a4a52;
  --red: #d95757;
  --green: #6a9b6a;
  --chart-bg: rgba(255, 255, 255, 0.015);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a10;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Figtree', system-ui, sans-serif;
  padding: 40px;
}

/* ── Outer shadow container (simulates tray popup) ── */
.tray-popup {
  position: relative;
  filter: drop-shadow(0 32px 80px rgba(0,0,0,0.9)) drop-shadow(0 8px 24px rgba(0,0,0,0.6));
}

/* ── Card body ── */
.card {
  width: 380px;
  background: linear-gradient(165deg, #0e0e16 0%, #08080c 100%);
  border-radius: 20px;
  border: 1px solid rgba(212, 175, 55, 0.08);
  padding: 0;
  position: relative;
  overflow: hidden;
}

/* Subtle top glow */
.card::before {
  content: '';
  position: absolute;
  top: -60px; left: 50%;
  transform: translateX(-50%);
  width: 200px; height: 100px;
  background: radial-gradient(ellipse, rgba(212, 175, 55, 0.06) 0%, transparent 70%);
  pointer-events: none;
}

/* Decorative corner */
.card::after {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 60px; height: 60px;
  border-top: 1px solid rgba(212, 175, 55, 0.10);
  border-right: 1px solid rgba(212, 175, 55, 0.10);
  border-radius: 0 20px 0 0;
  pointer-events: none;
}

/* ── Header ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px 0;
  position: relative;
}

.brand {
  font-family: 'Figtree', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 1.5px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-icon {
  display: inline-flex;
  width: 22px; height: 22px;
  border-radius: 6px;
  background: var(--gold-dim);
  align-items: center;
  justify-content: center;
  font-size: 13px;
  border: 1px solid rgba(212, 175, 55, 0.12);
}

.header-actions {
  display: flex;
  gap: 4px;
}
.header-btn {
  width: 26px; height: 26px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.header-btn:hover {
  background: rgba(255,255,255,0.04);
  color: var(--text);
}

/* ── Today Overview Stats ── */
.overview {
  display: flex;
  gap: 12px;
  padding: 14px 20px 18px;
  position: relative;
}

.stat-mini {
  flex: 1;
  background: var(--chart-bg);
  border: 1px solid rgba(255,255,255,0.03);
  border-radius: 12px;
  padding: 10px 12px;
  text-align: center;
  transition: background 0.2s;
}
.stat-mini:hover {
  background: rgba(255,255,255,0.025);
}

.stat-mini-value {
  font-family: 'DM Mono', monospace;
  font-size: 18px;
  font-weight: 500;
  letter-spacing: 1px;
  line-height: 1.3;
}
.stat-mini-value.gold  { color: var(--gold); }
.stat-mini-value.teal  { color: var(--teal); }
.stat-mini-value.green { color: var(--green); }

.stat-mini-label {
  font-size: 10px;
  color: var(--text-muted);
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-top: 2px;
}

/* ── Separator ── */
.sep {
  margin: 0 20px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(212,175,55,0.06) 20%, rgba(212,175,55,0.06) 80%, transparent);
}

/* ── Menu items ── */
.menu {
  padding: 6px 8px;
}

.menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.12s;
  position: relative;
  user-select: none;
}
.menu-item:hover {
  background: rgba(255,255,255,0.03);
}
.menu-item:active {
  background: rgba(212, 175, 55, 0.06);
  transform: scale(0.985);
}

.menu-item-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
  background: rgba(255,255,255,0.025);
  border: 1px solid rgba(255,255,255,0.035);
  transition: all 0.2s;
}
.menu-item:hover .menu-item-icon {
  background: var(--gold-dim);
  border-color: var(--gold-line);
}

.menu-item-info {
  flex: 1;
  min-width: 0;
}

.menu-item-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
}

.menu-item-desc {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 400;
  line-height: 1.2;
}

/* Right-side indicator (toggles, badges) */
.menu-item-right {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

/* Toggle switch */
.toggle {
  width: 36px; height: 20px;
  border-radius: 10px;
  background: rgba(255,255,255,0.06);
  position: relative;
  transition: all 0.25s;
  flex-shrink: 0;
}
.toggle.on {
  background: var(--gold-dim);
  border: 1px solid rgba(212, 175, 55, 0.15);
}
.toggle-knob {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: #555;
  position: absolute;
  top: 2px; left: 2px;
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.toggle.on .toggle-knob {
  left: 18px;
  background: var(--gold);
  box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
}

/* Reminder mode sub-menu */
.reminder-modes {
  display: flex;
  gap: 4px;
  margin-left: 44px;
  padding: 2px 12px 8px;
  flex-wrap: wrap;
}

.reminder-chip {
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.04);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
  font-family: 'Figtree', sans-serif;
  font-weight: 500;
}
.reminder-chip:hover {
  border-color: rgba(255,255,255,0.08);
  color: var(--text-dim);
}
.reminder-chip.active {
  border-color: var(--gold-line);
  background: var(--gold-dim);
  color: var(--gold);
}

/* ── Streak badge (conditional) ── */
.streak-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: #d97757;
  background: rgba(217, 119, 87, 0.08);
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid rgba(217, 119, 87, 0.10);
}

/* ── Footer ── */
.footer {
  padding: 10px 20px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.footer-version {
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
}
.footer-tip {
  font-size: 10px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 4px;
}

/* ── Hover tooltip arrow simulation ── */
.tray-arrow {
  width: 14px; height: 14px;
  background: var(--surface);
  border: 1px solid rgba(212, 175, 55, 0.08);
  border-right: none;
  border-bottom: none;
  position: absolute;
  top: -8px;
  right: 30px;
  transform: rotate(45deg);
  z-index: -1;
}

/* ── Animations ── */
.card {
  animation: cardIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes cardIn {
  0% {
    opacity: 0;
    transform: scale(0.92) translateY(-8px);
  }
  100% {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.stat-mini:nth-child(1) { animation: statFade 0.4s 0.05s both; }
.stat-mini:nth-child(2) { animation: statFade 0.4s 0.1s both; }
.stat-mini:nth-child(3) { animation: statFade 0.4s 0.15s both; }

@keyframes statFade {
  0% { opacity: 0; transform: translateY(4px); }
  100% { opacity: 1; transform: translateY(0); }
}

.menu-item {
  animation: itemFade 0.35s both;
}
.menu-item:nth-child(1) { animation-delay: 0.04s; }
.menu-item:nth-child(2) { animation-delay: 0.07s; }
.menu-item:nth-child(3) { animation-delay: 0.10s; }
.menu-item:nth-child(4) { animation-delay: 0.13s; }
.menu-item:nth-child(5) { animation-delay: 0.16s; }
.menu-item:nth-child(6) { animation-delay: 0.19s; }

@keyframes itemFade {
  0% { opacity: 0; transform: translateX(-6px); }
  100% { opacity: 1; transform: translateX(0); }
}

/* Gold shimmer on hover for quit */
.menu-item.danger:hover .menu-item-icon {
  background: rgba(217, 87, 87, 0.08);
  border-color: rgba(217, 87, 87, 0.15);
}
.menu-item.danger:hover .menu-item-title {
  color: var(--red);
}

/* ── Responsive ── */
@media (max-width: 420px) {
  .card { width: 340px; border-radius: 16px; }
  .overview { padding: 10px 14px 14px; gap: 8px; }
  .stat-mini { padding: 8px 6px; }
  .stat-mini-value { font-size: 16px; }
  .menu { padding: 4px 6px; }
}
</style>
</head>
<body>

<div class="tray-popup">
  <div class="card">

    <!-- Header -->
    <div class="header">
      <div class="brand">
        <span class="brand-icon">⚡</span>
        <span>精力管理</span>
      </div>
      <div class="header-actions">
        <button class="header-btn" title="固定/取消固定">📌</button>
        <button class="header-btn" title="设置">⚙</button>
      </div>
    </div>

    <!-- Overview Stats -->
    <div class="overview">
      <div class="stat-mini">
        <div class="stat-mini-value gold">6<span style="font-size:13px;font-weight:300;opacity:0.5">h</span></div>
        <div class="stat-mini-label">今日学习</div>
      </div>
      <div class="stat-mini">
        <div class="stat-mini-value teal">8<span style="font-size:13px;font-weight:300;opacity:0.5">d</span></div>
        <div class="stat-mini-label">连续打卡</div>
      </div>
      <div class="stat-mini">
        <div class="stat-mini-value green">23<span style="font-size:13px;font-weight:300;opacity:0.5">m</span></div>
        <div class="stat-mini-label">今日休息</div>
      </div>
    </div>

    <!-- Separator -->
    <div class="sep"></div>

    <!-- Menu -->
    <div class="menu">

      <!-- 显示/隐藏 -->
      <div class="menu-item">
        <div class="menu-item-icon">👁</div>
        <div class="menu-item-info">
          <div class="menu-item-title">显示 / 隐藏窗口</div>
          <div class="menu-item-desc">Ctrl+Alt+P 快速切换</div>
        </div>
        <div class="menu-item-right">
          <span class="streak-badge">🔥 8</span>
        </div>
      </div>

      <!-- 开机自启动 (toggle) -->
      <div class="menu-item">
        <div class="menu-item-icon">🔁</div>
        <div class="menu-item-info">
          <div class="menu-item-title">开机自启动</div>
          <div class="menu-item-desc">系统登录后自动运行</div>
        </div>
        <div class="menu-item-right">
          <div class="toggle on"><div class="toggle-knob"></div></div>
        </div>
      </div>

      <!-- 提醒方式 (expandable) -->
      <div class="menu-item" style="cursor: default;">
        <div class="menu-item-icon">🔔</div>
        <div class="menu-item-info">
          <div class="menu-item-title">提醒方式</div>
          <div class="menu-item-desc">倒计时结束时的动作</div>
        </div>
        <div class="menu-item-right">
          <span style="color:var(--gold);font-size:11px;">金句</span>
          <span style="color:var(--text-muted);font-size:8px;">▾</span>
        </div>
      </div>
      <!-- Chips under reminder -->
      <div class="reminder-modes">
        <span class="reminder-chip">打开 B站</span>
        <span class="reminder-chip active">💡 请辨金句</span>
        <span class="reminder-chip">通知</span>
        <span class="reminder-chip">无操作</span>
      </div>

      <!-- 学习统计 -->
      <div class="menu-item">
        <div class="menu-item-icon">📊</div>
        <div class="menu-item-info">
          <div class="menu-item-title">学习统计</div>
          <div class="menu-item-desc">最近 7 天学习 / 电脑使用图表</div>
        </div>
        <div class="menu-item-right">
          <span style="font-size:10px;color:var(--text-muted);">↗</span>
        </div>
      </div>

      <!-- 导出数据 -->
      <div class="menu-item">
        <div class="menu-item-icon">📋</div>
        <div class="menu-item-info">
          <div class="menu-item-title">导出本周数据</div>
          <div class="menu-item-desc">复制到剪贴板，支持粘贴到表格</div>
        </div>
        <div class="menu-item-right">
          <span style="font-family:'DM Mono',monospace;font-size:10px;color:var(--text-muted);">⌘C</span>
        </div>
      </div>

      <!-- 退出 -->
      <div class="menu-item danger">
        <div class="menu-item-icon">⏻</div>
        <div class="menu-item-info">
          <div class="menu-item-title">退出</div>
          <div class="menu-item-desc">关闭后台计时与所有提醒</div>
        </div>
        <div class="menu-item-right">
          <span style="font-size:8px;color:var(--text-muted);">⇧⌘Q</span>
        </div>
      </div>

    </div>

    <!-- Separator -->
    <div class="sep"></div>

    <!-- Footer -->
    <div class="footer">
      <span class="footer-version">v3.2</span>
      <span class="footer-tip">⏎ 点击即执行</span>
    </div>

  </div>
</div>

<script>
// Simple toggle interaction for demo
document.querySelectorAll('.menu-item:has(.toggle)').forEach(item => {
  item.addEventListener('click', function(e) {
    const toggle = this.querySelector('.toggle');
    if (toggle) toggle.classList.toggle('on');
  });
});

// Chip selection
document.querySelectorAll('.reminder-chip').forEach(chip => {
  chip.addEventListener('click', function() {
    document.querySelectorAll('.reminder-chip').forEach(c => c.classList.remove('active'));
    this.classList.add('active');
  });
});
</script>

</body>
</html>
