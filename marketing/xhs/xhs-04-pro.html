<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1440px;background:#0a0a0f;font-family:'Inter','Helvetica Neue',sans-serif;color:#fff;overflow:hidden}
.grid{position:absolute;top:72px;left:72px;right:72px;bottom:80px;display:flex;flex-direction:column;justify-content:space-between}
.title{font-size:48px;font-weight:800;letter-spacing:-1px}
.title span{color:#00d4ff}
.two{display:flex;gap:20px;margin-top:32px}
.col{flex:1;border-radius:16px;padding:28px}
.col.free{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1)}
.col.pro{background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.3)}
.col .tag{font-size:14px;font-weight:700;letter-spacing:2px;margin-bottom:16px}
.col.free .tag{color:#888}
.col.pro .tag{color:#00d4ff}
.col ul{list-style:none;font-size:16px;line-height:2.2}
.col ul li::before{margin-right:8px}
.col.free ul li::before{content:"✓";color:#4caf50}
.col.pro ul li::before{content:"★";color:#00d4ff}
.col.pro ul li.disabled{color:#444}
.col.pro ul li.disabled::before{content:"☆";color:#333}
.referral{margin-top:28px;background:linear-gradient(135deg,rgba(0,212,255,0.1),rgba(76,175,80,0.1));border:1px solid rgba(0,212,255,0.2);border-radius:16px;padding:28px;text-align:center}
.referral .big{font-size:36px;font-weight:800;color:#00d4ff}
.referral .sub{font-size:18px;color:#888;margin-top:8px}
.page{position:absolute;bottom:80px;right:72px;font-size:14px;color:#444}
</style></head><body>
<div class="grid">
  <div>
    <div class="title">免费版 <span>vs</span> Pro版</div>
    <div class="two">
      <div class="col free">
        <div class="tag">🆓 免费版</div>
        <ul>
          <li>60分钟循环提醒</li>
          <li>B站护眼视频</li>
          <li>学习时长追踪</li>
          <li>连续打卡统计</li>
          <li>电脑使用监控</li>
          <li>开机自启</li>
        </ul>
      </div>
      <div class="col pro">
        <div class="tag">💎 PRO版</div>
        <ul>
          <li>自定义提醒间隔</li>
          <li>云同步数据</li>
          <li>周报/月报统计</li>
          <li>数据导出CSV</li>
          <li>4套主题</li>
          <li class="disabled">19.9元/月</li>
        </ul>
      </div>
    </div>
    <div class="referral">
      <div class="big">🎁 推荐返利</div>
      <div class="sub">分享推荐码给朋友，双方各得7天免费Pro</div>
    </div>
  </div>
  <div class="page">04 / 05</div>
</div>
</body></html>
