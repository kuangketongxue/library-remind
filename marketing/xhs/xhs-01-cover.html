<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1440px;background:#0a0a0f;font-family:'Inter','Helvetica Neue',sans-serif;color:#fff;overflow:hidden;position:relative}
.grid{position:absolute;top:72px;left:72px;right:72px;bottom:80px;display:flex;flex-direction:column;justify-content:space-between}
.tag{font-size:14px;letter-spacing:4px;text-transform:uppercase;color:#00d4ff;font-weight:500}
.title{font-size:72px;font-weight:800;line-height:1.1;margin-top:24px;letter-spacing:-2px}
.title span{color:#00d4ff}
.subtitle{font-size:22px;color:#888;margin-top:16px;line-height:1.5}
.features{display:flex;gap:16px;margin-top:40px}
.feat{flex:1;background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.2);border-radius:12px;padding:20px;text-align:center}
.feat .icon{font-size:32px;margin-bottom:8px}
.feat .label{font-size:14px;color:#aaa}
.screenshot{margin-top:32px;border-radius:16px;overflow:hidden;border:2px solid rgba(0,212,255,0.3);position:relative;height:360px;background:#111;display:flex;align-items:center;justify-content:center}
.screenshot img{width:100%;height:100%;object-fit:cover}
.bottom{display:flex;justify-content:space-between;align-items:flex-end}
.price{font-size:28px;font-weight:700;color:#00d4ff}
.free{font-size:16px;color:#4caf50;margin-top:4px}
.qr{width:80px;height:80px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center}
.qr span{font-size:10px;color:#333;text-align:center}
</style></head><body>
<div class="grid">
  <div>
    <div class="tag">Productivity Tool</div>
    <div class="title">久坐<span>自动提醒</span><br>学习效率翻倍</div>
    <div class="subtitle">每小时自动弹出休息提醒 + B站护眼视频</div>
    <div class="features">
      <div class="feat"><div class="icon">⏰</div><div class="label">智能计时</div></div>
      <div class="feat"><div class="icon">📊</div><div class="label">学习追踪</div></div>
      <div class="feat"><div class="icon">🎁</div><div class="label">推荐返利</div></div>
    </div>
  </div>
  <div class="bottom">
    <div>
      <div class="price">免费使用</div>
      <div class="free">Pro版 19.9元/月</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:13px;color:#666">GitHub 搜索</div>
      <div style="font-size:16px;font-weight:600;color:#fff">RestReminder</div>
    </div>
  </div>
</div>
</body></html>
