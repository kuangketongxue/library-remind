<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1440px;background:#0a0a0f;font-family:'Inter','Helvetica Neue',sans-serif;color:#fff;overflow:hidden}
.grid{position:absolute;top:72px;left:72px;right:72px;bottom:80px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.icon{font-size:80px;margin-bottom:24px}
.title{font-size:52px;font-weight:800;letter-spacing:-1px}
.title span{color:#00d4ff}
.sub{font-size:20px;color:#888;margin-top:12px;line-height:1.6}
.steps{margin-top:40px;text-align:left;width:100%;max-width:600px}
.step{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.step .num{width:36px;height:36px;background:#00d4ff;color:#0a0a0f;font-weight:800;font-size:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step .text{font-size:18px;color:#ccc}
.cta{margin-top:40px;padding:16px 48px;background:#00d4ff;color:#0a0a0f;font-size:20px;font-weight:700;border-radius:50px}
.links{margin-top:24px;font-size:14px;color:#555}
.links span{color:#00d4ff}
.page{position:absolute;bottom:80px;right:72px;font-size:14px;color:#444}
</style></head><body>
<div class="grid">
  <div class="icon">🖥️</div>
  <div class="title">立即<span>下载</span></div>
  <div class="sub">免费使用 · 开源 · 隐私安全</div>
  <div class="steps">
    <div class="step"><div class="num">1</div><div class="text">GitHub 搜索 <b>RestReminder</b></div></div>
    <div class="step"><div class="num">2</div><div class="text">下载 RestReminder.exe，双击运行</div></div>
    <div class="step"><div class="num">3</div><div class="text">右下角绿色浮球，点击开始使用</div></div>
  </div>
  <div class="cta">⬇️ 免费下载</div>
  <div class="links">GitHub: <span>github.com/kuangketongxue/library-remind</span></div>
  <div class="links" style="margin-top:4px">官网: <span>crazy-rest-reminder.pages.dev</span></div>
  <div class="page">05 / 05</div>
</div>
</body></html>
