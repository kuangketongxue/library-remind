<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ 精力管理 — UI Final</title>
<style>
:root {
  --bg: #08080c;
  --card-bg: rgba(20, 20, 24, 0.88);
  --card-border: rgba(212, 175, 55, 0.12);
  --accent: #d4af37;
  --accent-secondary: #6a9bcc;
  --success: #78B450;
  --warning: #d97757;
  --text-primary: #e8e6e1;
  --text-secondary: #888;
  --text-muted: #555;
  --font-display: Georgia, "Noto Serif SC", serif;
  --font-body: "SF Pro Display", "Inter", system-ui, sans-serif;
  --font-mono: Consolas, "SF Mono", monospace;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-pill: 100px;
  --blur: blur(20px);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  gap: 40px;
  padding: 40px;
  flex-wrap: wrap;
}

.section-label {
  font-family: var(--font-display);
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 12px;
  text-align: center;
}

/* ═══════════════════════════════════════════
   Tray Popup - 3 Buttons Only
   ═══════════════════════════════════════════ */
.tray-popup {
  width: 260px;
  background: var(--card-bg);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-lg);
  box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(212,175,55,0.06);
  overflow: hidden;
  position: relative;
}

.tray-popup.running::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: var(--radius-lg);
  padding: 1px;
  background: linear-gradient(135deg, rgba(212,175,55,0.5), rgba(212,175,55,0.05), rgba(212,175,55,0.25));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  animation: breathe 3s ease-in-out infinite;
  pointer-events: none;
}

@keyframes breathe {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

/* Timer Section */
.tray-timer-section {
  padding: 28px 20px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}

.timer-ring {
  width: 80px;
  height: 80px;
  position: relative;
}

.timer-ring svg {
  transform: rotate(-90deg);
  width: 80px;
  height: 80px;
}

.timer-ring .bg {
  fill: none;
  stroke: rgba(255,255,255,0.06);
  stroke-width: 5;
}

.timer-ring .fill {
  fill: none;
  stroke: url(#timerGradient);
  stroke-width: 5;
  stroke-linecap: round;
  stroke-dasharray: 226;
  stroke-dashoffset: 50;
  transition: stroke-dashoffset 1s ease;
}

.timer-ring .time {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.timer-ring .time-value {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 1px;
}

.timer-ring .time-label {
  font-size: 9px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* Status Text */
.tray-status {
  font-family: var(--font-display);
  font-size: 12px;
  color: var(--text-secondary);
  text-align: center;
}

.tray-status .highlight {
  color: var(--accent);
  font-weight: 600;
}

/* 3 Action Buttons */
.tray-actions {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.tray-btn {
  width: 100%;
  padding: 12px 16px;
  border: none;
  border-radius: var(--radius-md);
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.tray-btn.primary {
  background: rgba(212, 175, 55, 0.12);
  color: var(--accent);
  border: 1px solid rgba(212, 175, 55, 0.2);
}

.tray-btn.primary:hover {
  background: rgba(212, 175, 55, 0.2);
  border-color: var(--accent);
  box-shadow: 0 0 16px rgba(212,175,55,0.15);
}

.tray-btn.secondary {
  background: rgba(255,255,255,0.04);
  color: var(--text-secondary);
  border: 1px solid rgba(255,255,255,0.06);
}

.tray-btn.secondary:hover {
  background: rgba(255,255,255,0.08);
  color: var(--text-primary);
}

.tray-btn.danger {
  background: rgba(212, 87, 87, 0.06);
  color: #c95555;
  border: 1px solid rgba(212, 87, 87, 0.12);
}

.tray-btn.danger:hover {
  background: rgba(212, 87, 87, 0.12);
}

.tray-btn .icon {
  font-size: 14px;
}

/* ═══════════════════════════════════════════
   Main Window - Full Card UI
   ═══════════════════════════════════════════ */
.main-window {
  width: 400px;
  background: radial-gradient(ellipse at 50% 0%, rgba(212,175,55,0.05) 0%, var(--bg) 70%);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-lg);
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  overflow: hidden;
}

.title-bar {
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}

.title-bar .title {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
}

.title-bar .spacer { flex: 1; }

.title-bar .timer-display {
  font-family: var(--font-mono);
  font-size: 26px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 2px;
}

.title-bar .close-btn {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.04);
  color: var(--text-muted);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.title-bar .close-btn:hover {
  color: var(--accent);
  background: rgba(212,175,55,0.1);
}

/* Card Grid */
.card-grid {
  padding: 14px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.card {
  background: var(--card-bg);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-md);
  padding: 14px;
  transition: border-color 0.2s;
}

.card:hover {
  border-color: rgba(212,175,55,0.2);
}

.card.full-width {
  grid-column: 1 / -1;
}

.card .card-label {
  font-family: var(--font-display);
  font-size: 9px;
  color: var(--text-muted);
  letter-spacing: 0.8px;
  margin-bottom: 6px;
}

.card .card-value {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 700;
}

.card .card-value.gold { color: var(--accent); }
.card .card-value.coral { color: var(--warning); }
.card .card-value.green { color: var(--success); }
.card .card-value.blue { color: var(--accent-secondary); }

.card .card-sub {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 2px;
}

.progress-track {
  height: 3px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  margin-top: 8px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, #8b6914, #d4af37, #f0d060);
  transition: width 1s ease;
}

/* Action Row */
.action-row {
  padding: 0 14px 14px;
  display: flex;
  gap: 8px;
}

.btn {
  flex: 1;
  padding: 9px 14px;
  border: none;
  border-radius: var(--radius-pill);
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn-primary {
  background: rgba(212, 175, 55, 0.12);
  color: var(--accent);
  border: 1px solid rgba(212, 175, 55, 0.2);
}

.btn-primary:hover {
  background: rgba(212, 175, 55, 0.2);
  border-color: var(--accent);
  box-shadow: 0 0 12px rgba(212,175,55,0.15);
}

.btn-secondary {
  background: rgba(255,255,255,0.04);
  color: var(--text-secondary);
  border: 1px solid rgba(255,255,255,0.06);
}

.btn-secondary:hover {
  background: rgba(255,255,255,0.08);
  color: var(--text-primary);
}

/* Pro Badge */
.pro-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  border-radius: var(--radius-pill);
  background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(212,175,55,0.05));
  border: 1px solid rgba(212,175,55,0.2);
  font-size: 9px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.5px;
}

/* AI Card */
.ai-card {
  background: linear-gradient(135deg, rgba(212,175,55,0.03), rgba(106,155,192,0.03));
  border-color: rgba(212,175,55,0.12);
}

.ai-card .ai-text {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.6;
}

/* Container */
.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
</style>
</head>
<body>

<!-- ═══ Tray Popup - 3 Buttons ═══ -->
<div class="container">
  <div class="section-label">托盘弹窗（点击托盘图标）</div>
  <div class="tray-popup running">
    <div class="tray-timer-section">
      <div class="timer-ring">
        <svg viewBox="0 0 80 80">
          <defs>
            <linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#8b6914"/>
              <stop offset="50%" stop-color="#d4af37"/>
              <stop offset="100%" stop-color="#f0d060"/>
            </linearGradient>
          </defs>
          <circle class="bg" cx="40" cy="40" r="36"/>
          <circle class="fill" cx="40" cy="40" r="36"/>
        </svg>
        <div class="time">
          <span class="time-value">42:15</span>
          <span class="time-label">续航剩余</span>
        </div>
      </div>
      <div class="tray-status">
        今日学习 <span class="highlight">6.5h</span> · 连续打卡 <span class="highlight">12天</span>
      </div>
    </div>
    <div class="tray-actions">
      <button class="tray-btn primary">
        <span class="icon">🖥️</span> 打开主界面
      </button>
      <button class="tray-btn secondary">
        <span class="icon">🌐</span> 打开官方网站
      </button>
      <button class="tray-btn danger">
        <span class="icon">✕</span> 退出
      </button>
    </div>
  </div>
</div>

<!-- ═══ Main Window ═══ -->
<div class="container">
  <div class="section-label">主窗口</div>
  <div class="main-window">
    <div class="title-bar">
      <span class="title">⚡ 精力管理</span>
      <span class="spacer"></span>
      <span class="timer-display">42:15</span>
      <button class="close-btn">×</button>
    </div>
    <div class="card-grid">
      <div class="card">
        <div class="card-label">📚 今日产出</div>
        <div class="card-value gold">6.5h</div>
        <div class="card-sub">目标 14h</div>
        <div class="progress-track"><div class="progress-fill" style="width:46%"></div></div>
      </div>
      <div class="card">
        <div class="card-label">🔥 连续打卡</div>
        <div class="card-value coral">12 天</div>
        <div class="card-sub">最佳 23 天</div>
      </div>
      <div class="card">
        <div class="card-label">☕ 今日休息</div>
        <div class="card-value green">45 分钟</div>
        <div class="card-sub">3 次休息</div>
      </div>
      <div class="card">
        <div class="card-label">⏳ 22:00倒计时</div>
        <div class="card-value blue">8h 30m</div>
        <div class="card-sub">今日截止</div>
      </div>
      <div class="card ai-card full-width">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
          <span class="pro-badge">✨ Pro</span>
          <span class="card-label" style="margin:0">AI 分析</span>
        </div>
        <div class="ai-text">💡 你上午 10-12 点专注度最高（平均 4.2⭐），建议将重要学习安排在这个时段。下午效率略有下降，可穿插休息。</div>
      </div>
    </div>
    <div class="action-row">
      <button class="btn btn-primary">▶ 开始学习</button>
      <button class="btn btn-secondary">📝 复盘</button>
      <button class="btn btn-secondary">📊 趋势</button>
    </div>
  </div>
</div>

</body>
</html>
