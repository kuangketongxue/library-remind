<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>精力管理 — 设置</title>
<link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>⚡ 精力管理 设置</h1>

    <div class="section">
      <h2>计时设置</h2>
      <div class="setting-row">
        <label>学习时长（分钟）</label>
        <input type="number" id="focusMinutes" min="15" max="120" value="60">
      </div>
      <div class="setting-row">
        <label>休息时长（分钟）</label>
        <input type="number" id="restMinutes" min="1" max="30" value="5">
      </div>
      <div class="setting-row">
        <label>护眼提醒间隔（分钟）</label>
        <input type="number" id="eyeRestInterval" min="10" max="60" value="20">
      </div>
    </div>

    <div class="section">
      <h2>通知</h2>
      <div class="setting-row">
        <label>启用桌面通知</label>
        <input type="checkbox" id="notificationsEnabled" checked>
      </div>
    </div>

    <div class="section">
      <h2>数据</h2>
      <div class="setting-row">
        <button class="btn" id="resetBtn">重置今日数据</button>
      </div>
      <div class="setting-row">
        <button class="btn btn-danger" id="clearAllBtn">清除所有数据</button>
      </div>
    </div>

    <div class="footer">
      <p>精力管理 v1.0.0 — 久坐提醒 & 护眼</p>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
