<!DOCTYPE html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- 首次引导 -->
  <div class="onboarding" id="onboarding" style="display:none">
    <div class="onboard-card">
      <div class="onboard-icon">⚡</div>
      <div class="onboard-title">欢迎使用精力管理</div>
      <div class="onboard-page" id="onboardPage">
        <div class="onboard-step" data-step="0">
          <p>每学习 <strong>60 分钟</strong>，自动提醒你休息 <strong>5 分钟</strong></p>
          <p>休息后弹出复盘，给你本轮评分</p>
        </div>
        <div class="onboard-step" data-step="1" style="display:none">
          <p>每 <strong>20 分钟</strong>提醒你看看远处，保护眼睛</p>
          <p>每 <strong>3 轮</strong>自动打开护眼视频</p>
        </div>
        <div class="onboard-step" data-step="2" style="display:none">
          <p>支持 <strong>白噪音</strong>、<strong>AI 报告</strong>、<strong>成就系统</strong></p>
          <p>点击图标开始你的第一轮学习吧！</p>
        </div>
      </div>
      <div class="onboard-dots">
        <span class="dot active"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <button class="btn btn-primary onboard-btn" id="onboardNext">下一步</button>
    </div>
  </div>

  <div class="container">
    <!-- Streak -->
    <div class="streak-bar" id="streakBar" style="display:none">
      🔥 <span id="streakCount">0</span> 天连续打卡
    </div>

    <!-- 状态显示 -->
    <div class="status-section">
      <div class="status-badge" id="statusBadge">待机</div>
      <div class="timer-display" id="timerDisplay">60:00</div>
      <div class="subtitle" id="subtitle">点击开始学习</div>
    </div>

    <!-- 操作按钮 -->
    <div class="actions">
      <button class="btn btn-primary" id="mainBtn">▶ 开始学习</button>
      <button class="btn btn-secondary" id="skipBtn" style="display:none">⏭ 跳到休息</button>
    </div>

    <!-- 今日统计 -->
    <div class="stats">
      <div class="stat-item">
        <span class="stat-value" id="roundCount">0</span>
        <span class="stat-label">轮次</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="studyMinutes">0</span>
        <span class="stat-label">学习(分)</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="breakMinutes">0</span>
        <span class="stat-label">休息(分)</span>
      </div>
    </div>

    <!-- 白噪音 -->
    <div class="ambient-section">
      <div class="ambient-label">🎧 环境音</div>
      <div class="ambient-btns" id="ambientBtns"></div>
    </div>

    <!-- 22:00 倒计时 -->
    <div class="countdown-bar" id="countdown">距离 22:00 还有 --</div>

    <!-- 功能入口 -->
    <div class="shortcuts">
      <a href="#" class="shortcut" data-page="reports.html">🤖 AI报告</a>
      <a href="#" class="shortcut" data-page="trends.html">📊 趋势</a>
      <a href="#" class="shortcut" data-page="achievements.html">🏆 成就</a>
    </div>

    <!-- 底部链接 -->
    <div class="footer">
      <a href="#" id="optionsLink">⚙️ 设置</a>
      <span class="sep">·</span>
      <a href="#" id="themeToggle">🌙</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
