<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>📝 复盘评分</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  background: #0d0d12; color: #e8e6e1;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh;
}
.card {
  background: #16161c; border-radius: 16px; padding: 32px;
  width: 420px;
}
h1 { font-size: 22px; margin-bottom: 6px; text-align: center; }
.subtitle { color: #888; font-size: 13px; margin-bottom: 20px; text-align: center; }
.field-label { font-size: 13px; color: #888; margin-bottom: 8px; }

/* 学科选择 */
.subjects { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.subject-btn {
  padding: 8px 14px; border-radius: 8px; border: 1px solid #333;
  background: #222; color: #aaa; font-size: 13px; cursor: pointer;
  transition: all 0.12s; font-family: inherit;
}
.subject-btn:hover { border-color: #d4af37; color: #d4af37; }
.subject-btn.active { background: #d4af37; color: #0d0d12; border-color: #d4af37; font-weight: 600; }

/* 标签选择 */
.labels { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.label-btn {
  padding: 6px 12px; border-radius: 6px; border: 1px solid #333;
  background: #222; color: #aaa; font-size: 12px; cursor: pointer;
  transition: all 0.12s; font-family: inherit;
}
.label-btn:hover { border-color: #6a8cbb; color: #6a8cbb; }
.label-btn.active { background: #6a8cbb; color: #fff; border-color: #6a8cbb; }

/* 评分滑块 */
.score-section { text-align: center; margin: 16px 0; }
.score-display {
  font-size: 56px; font-weight: 700; color: #d4af37;
  font-variant-numeric: tabular-nums;
}
input[type="range"] {
  width: 100%; height: 8px; -webkit-appearance: none;
  background: linear-gradient(to right, #c95454, #d4af37, #78B450);
  border-radius: 4px; outline: none; margin: 12px 0;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 22px; height: 22px;
  background: #fff; border-radius: 50%; cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}
.score-labels { display: flex; justify-content: space-between; font-size: 11px; color: #555; }

/* ── 深度评分 ── */
.deep-section {
  margin-top: 16px; padding-top: 16px; border-top: 1px solid #222;
}
.deep-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.deep-title { font-size: 13px; color: #888; }
.deep-score-display {
  font-size: 32px; font-weight: 700; color: #d4af37;
  font-variant-numeric: tabular-nums;
}
.deep-breakdown { display: flex; gap: 8px; margin-top: 4px; }
.deep-factor {
  flex: 1; text-align: center; padding: 6px 4px;
  background: #0d0d12; border-radius: 6px;
}
.deep-factor-label { display: block; font-size: 10px; color: #555; }
.deep-factor-val { display: block; font-size: 14px; font-weight: 600; color: #aaa; margin-top: 2px; }

/* 按钮 */
.btn {
  width: 100%; padding: 14px; border: none; border-radius: 10px;
  font-size: 15px; font-weight: 600; cursor: pointer;
  background: #d4af37; color: #0d0d12; margin-top: 16px;
  font-family: inherit; transition: background 0.15s;
}
.btn:hover { background: #e8c44a; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.footer { margin-top: 12px; color: #555; font-size: 11px; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1>📝 本轮复盘</h1>
  <div class="subtitle" id="subtitle">第 1 轮学习</div>

  <div class="field-label">📚 学科</div>
  <div class="subjects" id="subjects"></div>

  <div class="field-label">💭 状态标签</div>
  <div class="labels" id="labels"></div>

  <div class="score-section">
    <div class="field-label">⭐ 学习质量</div>
    <div class="score-display" id="scoreDisplay">50</div>
    <input type="range" id="scoreSlider" min="1" max="100" value="50">
    <div class="score-labels">
      <span>1 基本没学</span>
      <span>50 还行</span>
      <span>100 完美</span>
    </div>
  </div>

  <!-- 深度专注评分 -->
  <div class="deep-section">
    <div class="deep-header">
      <div class="deep-title">🧠 深度专注评分</div>
    </div>
    <div class="deep-score-display" id="deepScoreDisplay">50</div>
    <div class="deep-breakdown">
      <div class="deep-factor">
        <span class="deep-factor-label">完成度</span>
        <span class="deep-factor-val" id="deepCompletion">100%</span>
      </div>
      <div class="deep-factor">
        <span class="deep-factor-label">专注度</span>
        <span class="deep-factor-val" id="deepFocus">100%</span>
      </div>
      <div class="deep-factor">
        <span class="deep-factor-label">连续性</span>
        <span class="deep-factor-val" id="deepContinuity">100%</span>
      </div>
    </div>
  </div>

  <button class="btn" id="submitBtn">提交复盘</button>
  <div class="footer">💡 方便时提交即可，不急</div>
</div>
<script>
// 检查是否启用提示音并播放
chrome.storage.local.get('settings', (res) => {
  const soundEnabled = res.settings?.soundEnabled !== false;
  if (soundEnabled) playChime();
});

function playChime() {
  try {
    const ctx = new AudioContext();
    const notes = [440, 554.37, 659.25]; // A4, C#5, E5 (更柔和的和弦)
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.12, ctx.currentTime + i * 0.2);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.2 + 0.6);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.2);
      osc.stop(ctx.currentTime + i * 0.2 + 0.6);
    });
  } catch (e) {}
}

const SUBJECTS = ['语', '数', '英', '物', '化', '政', '其他'];
const LABELS = ['专注', '疲劳', '收获大', '走神', '其他'];
let FOCUS_MINUTES = 60; // 默认值，从 storage 读取
chrome.storage.local.get('focusMinutes', r => {
  if (r.focusMinutes) FOCUS_MINUTES = r.focusMinutes;
});

let selectedSubject = null;
let selectedLabel = null;
let roundInfo = null; // 从 state 获取本轮信息

// 渲染学科按钮
const subjectsEl = document.getElementById('subjects');
SUBJECTS.forEach(s => {
  const btn = document.createElement('button');
  btn.className = 'subject-btn';
  btn.textContent = s;
  btn.addEventListener('click', () => {
    subjectsEl.querySelectorAll('.subject-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedSubject = s;
  });
  subjectsEl.appendChild(btn);
});

// 渲染标签按钮
const labelsEl = document.getElementById('labels');
LABELS.forEach(l => {
  const btn = document.createElement('button');
  btn.className = 'label-btn';
  btn.textContent = l;
  btn.addEventListener('click', () => {
    labelsEl.querySelectorAll('.label-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedLabel = l;
  });
  labelsEl.appendChild(btn);
});

// 获取轮次 + 实际学习时间（深度评分）
chrome.runtime.sendMessage({ action: 'getState' }, (state) => {
  document.getElementById('subtitle').textContent = `第 ${state.roundCount} 轮学习`;
  roundInfo = state;
  updateDeepScore(); // 初始计算
});

// 滑块 + 实时深度评分
const slider = document.getElementById('scoreSlider');
const display = document.getElementById('scoreDisplay');
slider.addEventListener('input', () => {
  const v = parseInt(slider.value);
  display.textContent = v;
  display.style.color = v >= 80 ? '#78B450' : v >= 50 ? '#d4af37' : '#c95454';
  updateDeepScore();
});

// ── 深度评分 ──
function updateDeepScore() {
  if (!roundInfo) return;
  const selfScore = parseInt(slider.value) || 50;
  const now = Date.now();
  let actualMinutes = FOCUS_MINUTES;
  if (roundInfo.focusStartedAt) {
    actualMinutes = (now - roundInfo.focusStartedAt) / 60000;
    actualMinutes = Math.min(Math.max(actualMinutes, 1), FOCUS_MINUTES);
  }
  const pausedCount = roundInfo.pausedCount || 0;
  const streak = roundInfo.streak || 0;

  const completion = Math.round(Math.min(Math.max(actualMinutes / FOCUS_MINUTES, 0.6), 1) * 100);
  const focus = Math.round(Math.max(1 - pausedCount * 0.08, 0.6) * 100);
  const continuity = Math.round(Math.min(0.8 + streak * 0.01, 1) * 100);
  const deepScore = Math.round(selfScore * (completion / 100) * (focus / 100) * (continuity / 100));

  const deepDisplay = document.getElementById('deepScoreDisplay');
  deepDisplay.textContent = deepScore;
  deepDisplay.style.color = deepScore >= 80 ? '#78B450' : deepScore >= 50 ? '#d4af37' : '#c95454';
  document.getElementById('deepCompletion').textContent = completion + '%';
  document.getElementById('deepFocus').textContent = focus + '%';
  document.getElementById('deepContinuity').textContent = continuity + '%';
}

// 提交
document.getElementById('submitBtn').addEventListener('click', () => {
  const score = parseInt(slider.value);
  const selfScore = score;
  const now = Date.now();
  let actualMinutes = FOCUS_MINUTES;
  if (roundInfo && roundInfo.focusStartedAt) {
    actualMinutes = (now - roundInfo.focusStartedAt) / 60000;
    actualMinutes = Math.min(Math.max(actualMinutes, 1), FOCUS_MINUTES);
  }
  const pausedCount = roundInfo?.pausedCount || 0;
  const streak = roundInfo?.streak || 0;
  const completion = Math.round(Math.min(Math.max(actualMinutes / FOCUS_MINUTES, 0.6), 1) * 100);
  const focus = Math.round(Math.max(1 - pausedCount * 0.08, 0.6) * 100);
  const continuity = Math.round(Math.min(0.8 + streak * 0.01, 1) * 100);
  const deepScore = Math.round(selfScore * (completion / 100) * (focus / 100) * (continuity / 100));

  chrome.runtime.sendMessage({
    action: 'submitReview',
    score,
    subject: selectedSubject || '其他',
    label: selectedLabel || '其他',
    deepScore: { score: deepScore, completion, focus, continuity },
  }, (res) => {
    if (res && res.ok) {
      const btn = document.getElementById('submitBtn');
      btn.textContent = '✓ 已提交';
      btn.disabled = true;
      btn.style.background = '#78B450';
      setTimeout(() => window.close(), 1500);
    }
  });
});
</script>
</body>
</html>
