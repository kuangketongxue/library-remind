<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; background: #0a0a0b; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  canvas { image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c" width="512" height="512"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = 512, H = 512;

// Background
ctx.fillStyle = '#0a0a0b';
ctx.fillRect(0, 0, W, H);

// Subtle grid pattern
ctx.strokeStyle = '#1a1a25';
ctx.lineWidth = 0.5;
for (let x = 0; x < W; x += 24) {
  ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
}
for (let y = 0; y < H; y += 24) {
  ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
}

// Amber glow behind the icon
const glow = ctx.createRadialGradient(256, 240, 20, 256, 240, 180);
glow.addColorStop(0, 'rgba(245, 158, 11, 0.15)');
glow.addColorStop(0.5, 'rgba(245, 158, 11, 0.05)');
glow.addColorStop(1, 'rgba(245, 158, 11, 0)');
ctx.fillStyle = glow;
ctx.fillRect(0, 0, W, H);

// Diamond decoration (top-right)
ctx.save();
ctx.translate(420, 60);
ctx.rotate(Math.PI / 4);
ctx.fillStyle = '#f59e0b';
ctx.fillRect(-12, -12, 24, 24);
ctx.restore();

// Star decoration (top-left)
ctx.save();
ctx.translate(70, 80);
ctx.beginPath();
const spikes = 4, outerR = 16, innerR = 6;
for (let i = 0; i < spikes * 2; i++) {
  const r = i % 2 === 0 ? outerR : innerR;
  const a = (i * Math.PI) / spikes - Math.PI / 2;
  ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
}
ctx.closePath();
ctx.fillStyle = '#f59e0b';
ctx.fill();
ctx.restore();

// Small circle decoration (bottom-right)
ctx.beginPath();
ctx.arc(430, 430, 18, 0, Math.PI * 2);
ctx.strokeStyle = '#7c3aed';
ctx.lineWidth = 2;
ctx.stroke();
// Inner dot
ctx.beginPath();
ctx.arc(430, 430, 4, 0, Math.PI * 2);
ctx.fillStyle = '#7c3aed';
ctx.fill();

// Diagonal accent lines (bottom-left)
ctx.strokeStyle = '#7c3aed';
ctx.lineWidth = 3;
ctx.beginPath(); ctx.moveTo(0, 480); ctx.lineTo(80, 480); ctx.stroke();
ctx.beginPath(); ctx.moveTo(0, 460); ctx.lineTo(50, 460); ctx.stroke();
ctx.beginPath(); ctx.moveTo(20, 440); ctx.lineTo(60, 440); ctx.stroke();

// Center icon group — geometric lightning / eye symbol
ctx.save();
ctx.translate(256, 220);

// Outer hexagon frame
ctx.beginPath();
const hexR = 55;
for (let i = 0; i < 6; i++) {
  const a = (i * Math.PI) / 3 - Math.PI / 6;
  const px = Math.cos(a) * hexR, py = Math.sin(a) * hexR;
  i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
}
ctx.closePath();
ctx.strokeStyle = '#f59e0b';
ctx.lineWidth = 2.5;
ctx.stroke();

// Inner diamond
ctx.beginPath();
ctx.moveTo(0, -28);
ctx.lineTo(22, 0);
ctx.lineTo(0, 28);
ctx.lineTo(-22, 0);
ctx.closePath();
ctx.fillStyle = '#f59e0b';
ctx.fill();

// Eye shape inside diamond
ctx.beginPath();
ctx.ellipse(0, 0, 18, 8, 0, 0, Math.PI * 2);
ctx.fillStyle = '#0a0a0b';
ctx.fill();

// Pupil
ctx.beginPath();
ctx.arc(0, 0, 4, 0, Math.PI * 2);
ctx.fillStyle = '#f59e0b';
ctx.fill();

// Lightning bolt going through eye
ctx.beginPath();
ctx.moveTo(-4, -20);
ctx.lineTo(6, -4);
ctx.lineTo(0, -4);
ctx.lineTo(8, 20);
ctx.lineTo(-2, 4);
ctx.lineTo(4, 4);
ctx.closePath();
ctx.fillStyle = '#0a0a0b';
ctx.fill();

ctx.restore();

// "REST" text
ctx.fillStyle = '#f59e0b';
ctx.font = '900 52px "Oswald", Impact, "Arial Black", sans-serif';
ctx.textAlign = 'center';
ctx.fillText('REST', 256, 330);

// "REMINDER" text
ctx.fillStyle = '#e8e8e8';
ctx.font = '700 18px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif';
ctx.letterSpacing = '6px';
ctx.fillText('R E M I N D E R', 256, 358);

// Thin amber line separator
ctx.strokeStyle = '#f59e0b';
ctx.lineWidth = 1;
ctx.beginPath(); ctx.moveTo(180, 370); ctx.lineTo(332, 370); ctx.stroke();

// Bottom tagline
ctx.fillStyle = '#555';
ctx.font = '400 11px "Inter", "PingFang SC", sans-serif';
ctx.fillText('保 护 眼 睛 · 从 每 次 休 息 开 始', 256, 392);

// Corner accents (CC Switch style)
// Top-right corner bracket
ctx.strokeStyle = '#f59e0b44';
ctx.lineWidth = 1.5;
ctx.beginPath(); ctx.moveTo(W - 30, 0); ctx.lineTo(W, 0); ctx.lineTo(W, 30); ctx.stroke();
// Bottom-left corner bracket
ctx.beginPath(); ctx.moveTo(0, H - 30); ctx.lineTo(0, H); ctx.lineTo(30, H); ctx.stroke();

// Save
const link = document.createElement('a');
link.download = 'rest-reminder-logo.png';
link.href = c.toDataURL('image/png');
link.click();
</script>
</body>
</html>
