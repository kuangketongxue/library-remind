name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Build website
        run: |
          cd rest-reminder-site
          npm ci
          npm run build  # 自动执行 fix-routes.js

      - name: Verify build output
        run: |
          echo "=== 验证构建产物 ==="
          for page in contact docs pricing privacy terms rules; do
            if [ ! -f "rest-reminder-site/out/$page/index.html" ]; then
              echo "❌ 缺少 rest-reminder-site/out/$page/index.html"
              exit 1
            fi
            echo "✓ $page/index.html"
          done
          if [ ! -f "rest-reminder-site/out/index.html" ]; then
            echo "❌ 缺少 rest-reminder-site/out/index.html"
            exit 1
          fi
          echo "✓ index.html"
          echo "=== 验证通过 ==="

      - name: Deploy to Cloudflare Pages
        run: |
          cd rest-reminder-site
          # 必须从项目根目录部署，确保 Functions 一起部署
          # 不能用 wrangler pages deploy out，否则 Worker 会丢失
          wrangler pages deploy . --project-name=crazy-rest-reminder --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify deployment
        run: |
          echo "=== 验证部署 ==="
          sleep 15  # 等待 Cloudflare 部署生效
          for page in "" contact docs pricing privacy terms rules; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://crazy-rest-reminder.pages.dev/$page")
            if [ "$code" != "200" ]; then
              echo "❌ /$page 返回 $code"
              exit 1
            fi
            echo "✓ /$page → $code"
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://crazy-rest-reminder.pages.dev/api/ai-proxy" -H "Content-Type: application/json" -d '{"model":"auto","messages":[{"role":"user","content":"test"}]}')
          if [ "$code" != "200" ]; then
            echo "❌ /api/ai-proxy 返回 $code"
            exit 1
          fi
          echo "✓ /api/ai-proxy → $code"
          echo "=== 部署验证通过 ==="
